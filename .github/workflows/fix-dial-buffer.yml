name: Fix dial buffer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand dial render buffer
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/cycle-hero.tsx')
          s = p.read_text()
          old = 'const DIAL_BUFFER_RADIUS = 24;'
          new = 'const DIAL_BUFFER_RADIUS = 10000;'
          if old not in s:
              raise SystemExit('Expected dial buffer line not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/cycle-hero.tsx
          git commit -m "Fix dial stalling across long momentum swipes"
          git push
